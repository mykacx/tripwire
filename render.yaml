# OPTIONAL, NOT DEPLOYED: Tripwire has no live URL. This Render Blueprint is provided
# only in case you want to host your own copy. https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tripwire
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/orders
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY # optional, used only if ANTHROPIC_API_KEY is empty
        sync: false
